name: CI

# Lint, typecheck and build must pass on every push and pull request.
# Deployment itself is handled by Vercel's git integration (see vercel.json):
# pushes to main deploy to production, other branches get preview deploys.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  SITE_DIR: apps/web/dist

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          set -eu
          test -f "$SITE_DIR/index.html" || { echo "::error::Build produced no index.html"; exit 1; }
          test -d "$SITE_DIR/assets" || { echo "::error::Build produced no assets/ directory"; exit 1; }
          # A build that still carries the removed copy must never ship.
          if grep -rq 'Birthday Edition' "$SITE_DIR/assets"/*.js; then
            echo "::error::The build still contains the removed 'Birthday Edition' text"
            exit 1
          fi
          echo "Build output: $(find "$SITE_DIR" -type f | wc -l) files"
          echo "Bundle size: $(du -sh "$SITE_DIR" | cut -f1)"

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## FrenOS XP"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (oxlint) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Typecheck (tsc) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Build (vite) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo
            echo "Deployment is handled by Vercel git integration (main -> production, other branches -> preview)."
          } >> "$GITHUB_STEP_SUMMARY"
