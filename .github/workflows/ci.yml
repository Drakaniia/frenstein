name: CI

# Lint, typecheck and build must pass before anything is deployed.
# The deploy job publishes the exact artifact CI built to GitHub Pages and
# then smoke-tests the live URL, so every push to main ships automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  SITE_DIR: apps/web/dist

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          set -eu
          test -f "$SITE_DIR/index.html" || { echo "::error::Build produced no index.html"; exit 1; }
          test -d "$SITE_DIR/assets" || { echo "::error::Build produced no assets/ directory"; exit 1; }
          echo "Build output: $(find "$SITE_DIR" -type f | wc -l) files"
          echo "Bundle size: $(du -sh "$SITE_DIR" | cut -f1)"

      - name: Upload the build for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ env.SITE_DIR }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    # Pull requests from forks are verified but never deployed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # Turns Pages on for the repository the first time this runs.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Smoke test the deployed site
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -eu
          [ -n "$PAGE_URL" ] || { echo "::error::Pages returned no URL"; exit 1; }
          echo "Checking $PAGE_URL"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' -L --retry 5 --retry-delay 3 --retry-all-errors "$PAGE_URL")
          echo "HTTP $code"
          test "$code" = "200" || { echo "::error::The site answered HTTP $code"; exit 1; }
          grep -qi 'id="root"' /tmp/index.html || { echo "::error::index.html does not contain the app root"; exit 1; }

          # Every asset the page references must load (catches a wrong base path).
          missing=0
          for ref in $(grep -oE '(src|href)="[^"]+\.(js|css)"' /tmp/index.html | sed -E 's/.*="([^"]+)"/\1/'); do
            case "$ref" in
              http*) asset="$ref" ;;
              /*) asset="${PAGE_URL%/}$ref" ;;
              *) asset="${PAGE_URL%/}/$ref" ;;
            esac
            asset_code=$(curl -sS -o /dev/null -w '%{http_code}' -L --retry 3 --retry-all-errors "$asset")
            echo "  $asset -> $asset_code"
            [ "$asset_code" = "200" ] || missing=1
          done
          test "$missing" = "0" || { echo "::error::A referenced asset is missing on the deployed site"; exit 1; }

          # The build must actually contain this commit's content.
          main_js=$(grep -oE 'assets/index-[^"]+\.js' /tmp/index.html | head -n 1)
          curl -sS -o /tmp/bundle.js -L "${PAGE_URL%/}/$main_js"
          grep -q 'Frenstein' /tmp/bundle.js || { echo "::error::The deployed bundle is stale (no 'Frenstein' in $main_js)"; exit 1; }
          if grep -q 'Birthday Edition' /tmp/bundle.js; then
            echo "::error::The deployed bundle still contains the old 'Birthday Edition' text"
            exit 1
          fi
          echo "Deployed bundle $main_js is current."

      - name: Write the run summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          {
            echo "## FrenOS XP"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (oxlint) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Typecheck (tsc) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Build (vite) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Deploy (GitHub Pages) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo
            if [ -n "${PAGE_URL}" ]; then echo "Live: ${PAGE_URL}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
