name: CI

# Lint, typecheck and build must all pass before anything is deployed.
# The deploy job reuses the build from the CI job, checks the deployed site
# with a smoke test, and puts the live URL in the run summary.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  SITE_DIR: apps/web/dist

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          set -eu
          test -f "$SITE_DIR/index.html" || { echo "::error::Build produced no index.html"; exit 1; }
          test -d "$SITE_DIR/assets" || { echo "::error::Build produced no assets/ directory"; exit 1; }
          count=$(find "$SITE_DIR/assets" -type f | wc -l)
          echo "Build output: $(find "$SITE_DIR" -type f | wc -l) files ($count under assets/)"
          echo "Bundle size: $(du -sh "$SITE_DIR" | cut -f1)"

      - name: Upload the build for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ env.SITE_DIR }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: ${{ github.event_name == 'push' && 'Deploy' || 'Preview deploy' }}
    needs: ci
    # Only deploy real code, never a pull request from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.target.outputs.url }}
    env:
      LIVE_URL: ${{ vars.FRENOS_SITE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Decide the deploy target
        id: target
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "url=${LIVE_URL:-https://frenos-xp-f46776.corepass-sites.com/}" >> "$GITHUB_OUTPUT"
            echo "provider=vercel" >> "$GITHUB_OUTPUT"
          else
            echo "url=${LIVE_URL:-https://frenos-xp-f46776.corepass-sites.com/}" >> "$GITHUB_OUTPUT"
            echo "provider=corepass" >> "$GITHUB_OUTPUT"
          fi

      # ── Vercel: used whenever the VERCEL_TOKEN secret is present ─────────
      - name: Install dependencies (Vercel CLI)
        if: steps.target.outputs.provider == 'vercel'
        run: bun install --frozen-lockfile

      - name: Deploy to Vercel
        if: steps.target.outputs.provider == 'vercel'
        id: vercel
        run: |
          set -eu
          args=(--prod --yes --token "$VERCEL_TOKEN")
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            args=("${args[@]/--prod/}" --token "$VERCEL_TOKEN")
          fi
          url=$(bunx vercel@latest deploy apps/web/dist "${args[@]}" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # ── Corepass: the default, because this site is already published ────
      - name: Publish to corepass
        if: steps.target.outputs.provider == 'corepass'
        env:
          COREPASS_TOKEN: ${{ secrets.COREPASS_TOKEN }}
        run: |
          if [ -z "$COREPASS_TOKEN" ]; then
            echo "::warning title=Deploy skipped::No COREPASS_TOKEN (or VERCEL_TOKEN) secret is set, so the verified build was not deployed. See docs/ci.md."
            exit 0
          fi
          # The corepass CLI publishes a built directory to the site's domain.
          bunx corepass deploy apps/web/dist --site frenos-xp --token "$COREPASS_TOKEN" --public
          echo "Published apps/web/dist to ${LIVE_URL}"

      - name: Smoke test the deployed site
        id: smoke
        run: |
          set -eu
          url="${{ steps.vercel.outputs.url || env.LIVE_URL }}"
          [ -n "$url" ] || { echo "::error::No deployed URL to test"; exit 1; }
          case "$url" in http*) ;; *) url="https://$url" ;; esac
          echo "Checking $url"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' -L --retry 5 --retry-delay 3 --retry-all-errors "$url")
          echo "HTTP $code"
          test "$code" = "200" || { echo "::error::The site answered HTTP $code"; exit 1; }
          grep -qi '<div id="root"' /tmp/index.html || { echo "::error::index.html does not contain the app root"; exit 1; }
          # Every asset the page references must exist (catches a broken base path).
          missing=0
          for ref in $(grep -oE '(src|href)="[^"]+\.(js|css)"' /tmp/index.html | sed -E 's/.*="([^"]+)"/\1/'); do
            case "$ref" in
              http*) asset="$ref" ;;
              /*) asset="${url%/}$ref" ;;
              *) asset="${url%/}/$ref" ;;
            esac
            asset_code=$(curl -sS -o /dev/null -w '%{http_code}' -L --retry 3 --retry-all-errors "$asset")
            echo "  $asset -> $asset_code"
            [ "$asset_code" = "200" ] || missing=1
          done
          test "$missing" = "0" || { echo "::error::A referenced asset is missing on the deployed site"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## FrenOS XP CI"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (oxlint) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Typecheck (tsc) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo "| Build (vite) | ${{ job.status == 'success' && 'passed' || 'see logs' }} |"
            echo
            echo "Deployed: ${{ steps.smoke.outputs.url || env.LIVE_URL || 'not deployed' }}"
          } >> "$GITHUB_STEP_SUMMARY"
